<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Path Construction</title>
<script>
  var API_BASE = new URLSearchParams(window.location.search).get('api_base') || window.location.origin;
</script>
<link rel="stylesheet" href="css/debug_common.css">
<link rel="stylesheet" href="css/path_build.css">
<script src="js/city_map.js"></script>
</head>
<body>
<!--
  パス新規建設ページ
  =================

  左パネルで道路種別・設定を選択し、右のマップ上でクリック操作により
  パスの形状を定義してバックエンドに送信する。

  操作フロー:
    1. 道路種別プルダウンでカテゴリを選択 → バリアントタイルが表示される
    2. バリアントタイルをクリックして選択
    3. マップ上で左クリック → 始点を配置（→ウェイポイント追加モード）
    4. 追加の左クリック → ウェイポイントを追加
    5. 右クリック → 最後のウェイポイントを終点とし、形状を確定
    6. 確定後は各ポイントをドラッグで移動可能
    7. 右クリックでポイントを削除（2点以下の場合は不可）
    8. 辺上の左クリックでウェイポイントを追加
    9. [確定] ボタンでバックエンドにPOST送信

  座標系:
    ゲームは X-Z 水平面・Y 標高。マップは真上からの Top-Down ビュー。
    screenX = (worldX - offsetX) * zoom
    screenY = (worldZ - offsetY) * zoom
-->

<div class="header">
  <h1>Path Construction</h1>
  <button onclick="resetAll()">Reload Data</button>
  <button onclick="map.resetView()">Fit All</button>
</div>

<div class="path-layout">
  <!-- 左サイドパネル -->
  <div class="path-panel">
    <!-- 道路種別選択 -->
    <div class="path-panel-section">
      <div class="path-panel-section-title">道路種別</div>
      <select id="path-type-select" class="path-type-select" onchange="onPathTypeChange()">
        <option value="">-- 種別を選択 --</option>
      </select>
    </div>

    <!-- バリアント選択 -->
    <div class="path-panel-section">
      <div class="path-panel-section-title">バリアント</div>
      <div id="variant-grid" class="variant-grid">
        <div class="empty-variants">種別を選択してください</div>
      </div>
    </div>

    <!-- 設定 -->
    <div class="path-panel-section">
      <div class="path-panel-section-title">設定</div>

      <div class="control-group">
        <span class="control-label">標高 (Y)</span>
        <div class="control-row">
          <input type="range" id="height-slider" class="control-slider"
                 min="-50" max="500" value="0" step="1"
                 oninput="onHeightChange()">
          <span id="height-value" class="control-value">0</span>
        </div>
      </div>

      <div class="control-group">
        <span class="control-label">描画モード</span>
        <select id="curve-mode" class="control-select" onchange="onCurveModeChange()">
          <option value="straight">直線</option>
          <option value="bezier">三次ベジエ</option>
          <option value="spline">Catmull-Rom スプライン</option>
        </select>
      </div>
    </div>

    <!-- アクションボタン -->
    <div class="path-panel-section">
      <div class="path-panel-section-title">操作</div>
      <div class="action-buttons">
        <button id="btn-confirm" class="action-btn btn-confirm" onclick="confirmPath()" disabled>確定</button>
        <button id="btn-cancel" class="action-btn" onclick="cancelPath()">キャンセル</button>
        <button id="btn-reset" class="action-btn btn-reset" onclick="resetPath()">リセット</button>
      </div>
    </div>

    <!-- レイヤー表示 -->
    <div class="path-panel-section">
      <div class="path-panel-section-title">レイヤー</div>
      <div id="layer-controls"></div>
    </div>

    <!-- 操作説明 -->
    <div class="path-panel-section" style="flex:1;">
      <div class="path-panel-section-title">操作方法</div>
      <div style="font-size:10px;color:var(--subtext);line-height:1.6;">
        左クリック: 始点/ウェイポイント配置<br>
        右クリック: 終点確定 / ポイント削除<br>
        ドラッグ: ポイント移動<br>
        辺クリック: ウェイポイント追加<br>
        ホイール: ズーム
      </div>
    </div>
  </div>

  <!-- マップエリア -->
  <div class="path-map-wrap" id="map-container">
    <div class="coord-overlay" id="coord-overlay">---, ---</div>
    <div class="zoom-overlay" id="zoom-overlay">100%</div>
    <div class="status-bar" id="status-bar">バリアントを選択してクリックで配置開始</div>
  </div>
</div>

<script>
/* ==================================================================
 * 定数
 * ================================================================== */

/** path_type の数値 → 表示名マッピング */
var PATH_TYPE_LABELS = {
  0: '仮想道路',
  1: '幹線道路',
  2: '生活道路',
  3: '歩行者道路',
  4: '線路',
  5: '公共交通',
};

/** path_type ごとのタイルアイコンプレースホルダー色 */
var PATH_TYPE_COLORS = {
  0: '#585b70',
  1: '#fab387',
  2: '#89b4fa',
  3: '#a6e3a1',
  4: '#f9e2af',
  5: '#cba6f7',
};

/** マウスヒット判定のスクリーン空間半径(px) */
var HIT_RADIUS = 8;

/** 辺クリック判定のスクリーン空間距離(px) */
var EDGE_HIT_RADIUS = 6;

/* ==================================================================
 * グローバル状態
 * ================================================================== */

var map = null;
var masterData = {};

/** パス建設の状態管理 */
var build = {
  /** 'IDLE' | 'PLACING' | 'EDITING' */
  mode: 'IDLE',
  /** 選択中のバリアントID (master.yaml のキー、数値) */
  selectedVariant: null,
  /** 標高 */
  height: 0,
  /** 描画モード: 'straight' | 'bezier' | 'spline' */
  curveMode: 'straight',
  /**
   * 配置済みポイント配列。各要素:
   * { x, z, role: 'start'|'waypoint'|'end' }
   * role='start' は先頭、role='end' は末尾に常に1つずつ存在する。
   */
  points: [],
  /** ベジエ制御点 (bezier/spline モードで使用) */
  startControl: null,
  endControl: null,
  /** ドラッグ中の対象情報 */
  dragging: null,
  /** マウスの現在ワールド座標（プレビュー線用） */
  mouseWorld: null,
};

/* ==================================================================
 * マスター情報の読み込みと UI 構築
 * ================================================================== */

function loadMasterData() {
  fetch(API_BASE + '/api/v1/master/paths')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      masterData = d.paths || {};
      buildPathTypeSelect();
    })
    .catch(function(err) {
      console.warn('Failed to load master paths:', err);
    });
}

/** 道路種別プルダウンを構築する */
function buildPathTypeSelect() {
  var sel = document.getElementById('path-type-select');
  /* 既存オプションをクリア（最初のプレースホルダーは残す） */
  sel.length = 1;

  /* masterData から出現する type 値を収集 */
  var typeSet = {};
  for (var key in masterData) {
    var t = masterData[key].type;
    if (t !== undefined && t !== 0) {
      typeSet[t] = true;
    }
  }
  var types = Object.keys(typeSet).map(Number).sort(function(a, b) { return a - b; });

  types.forEach(function(t) {
    var opt = document.createElement('option');
    opt.value = t;
    opt.textContent = PATH_TYPE_LABELS[t] || ('Type ' + t);
    sel.appendChild(opt);
  });
}

/** 選択された path_type に対応するバリアントタイルを表示する */
function onPathTypeChange() {
  var sel = document.getElementById('path-type-select');
  var typeVal = parseInt(sel.value);
  var grid = document.getElementById('variant-grid');
  grid.innerHTML = '';

  build.selectedVariant = null;
  updateConfirmButton();

  if (isNaN(typeVal)) {
    grid.innerHTML = '<div class="empty-variants">種別を選択してください</div>';
    return;
  }

  var variants = [];
  for (var key in masterData) {
    if (masterData[key].type === typeVal) {
      variants.push({ id: parseInt(key), data: masterData[key] });
    }
  }

  if (variants.length === 0) {
    grid.innerHTML = '<div class="empty-variants">該当なし</div>';
    return;
  }

  variants.forEach(function(v) {
    var tile = document.createElement('div');
    tile.className = 'variant-tile';
    tile.setAttribute('data-variant-id', v.id);

    var icon = document.createElement('div');
    icon.className = 'variant-icon';
    icon.style.background = PATH_TYPE_COLORS[typeVal] || '#585b70';

    var nameEl = document.createElement('div');
    nameEl.className = 'variant-name';
    nameEl.textContent = v.data.display_name || ('Variant ' + v.id);

    var infoEl = document.createElement('div');
    infoEl.className = 'variant-info';
    infoEl.textContent = '幅' + (v.data.width || 0) + 'm / ' + (v.data.lanes || 0) + '車線';

    tile.appendChild(icon);
    tile.appendChild(nameEl);
    tile.appendChild(infoEl);

    tile.addEventListener('click', function() {
      selectVariant(v.id);
    });

    grid.appendChild(tile);
  });
}

/** バリアントを選択する */
function selectVariant(variantId) {
  build.selectedVariant = variantId;

  var tiles = document.querySelectorAll('.variant-tile');
  tiles.forEach(function(t) {
    t.classList.toggle('selected', parseInt(t.getAttribute('data-variant-id')) === variantId);
  });

  updateConfirmButton();
  updateStatusBar();
}

/* ==================================================================
 * 設定コントロール
 * ================================================================== */

function onHeightChange() {
  var slider = document.getElementById('height-slider');
  build.height = parseInt(slider.value);
  document.getElementById('height-value').textContent = build.height;
}

function onCurveModeChange() {
  var sel = document.getElementById('curve-mode');
  build.curveMode = sel.value;

  /* 形状確定済みの場合は制御点を初期化 */
  if (build.mode === 'EDITING') {
    initControlPoints();
    map.draw();
  }
}

/** 現在のモードとポイントに応じて制御点を初期化する */
function initControlPoints() {
  var pts = build.points;
  if (pts.length < 2) {
    build.startControl = null;
    build.endControl = null;
    return;
  }

  if (build.curveMode === 'bezier') {
    /* ベジエ: 始点→終点の 1/3, 2/3 の位置に制御点を置く */
    var s = pts[0];
    var e = pts[pts.length - 1];
    build.startControl = {
      x: s.x + (e.x - s.x) / 3,
      z: s.z + (e.z - s.z) / 3,
    };
    build.endControl = {
      x: s.x + (e.x - s.x) * 2 / 3,
      z: s.z + (e.z - s.z) * 2 / 3,
    };
  } else if (build.curveMode === 'spline') {
    /* Catmull-Rom: 自動計算 */
    computeSplineControlPoints();
  } else {
    build.startControl = null;
    build.endControl = null;
  }
}

/** Catmull-Rom スプラインに基づいて始端・終端の制御点を自動計算する */
function computeSplineControlPoints() {
  var pts = build.points;
  if (pts.length < 2) return;

  if (pts.length === 2) {
    var s = pts[0], e = pts[1];
    build.startControl = {
      x: s.x + (e.x - s.x) / 3,
      z: s.z + (e.z - s.z) / 3,
    };
    build.endControl = {
      x: e.x - (e.x - s.x) / 3,
      z: e.z - (e.z - s.z) / 3,
    };
  } else {
    /* 始端: P0〜P2 から接線を計算 */
    var t0x = (pts[1].x - pts[0].x) * 0.5;
    var t0z = (pts[1].z - pts[0].z) * 0.5;
    if (pts.length > 2) {
      t0x = (pts[2].x - pts[0].x) / 6;
      t0z = (pts[2].z - pts[0].z) / 6;
    }
    build.startControl = {
      x: pts[0].x + t0x,
      z: pts[0].z + t0z,
    };

    /* 終端: Pn-2〜Pn から接線を計算 */
    var n = pts.length;
    var tnx = (pts[n - 1].x - pts[n - 2].x) * 0.5;
    var tnz = (pts[n - 1].z - pts[n - 2].z) * 0.5;
    if (n > 2) {
      tnx = (pts[n - 1].x - pts[n - 3].x) / 6;
      tnz = (pts[n - 1].z - pts[n - 3].z) / 6;
    }
    build.endControl = {
      x: pts[n - 1].x - tnx,
      z: pts[n - 1].z - tnz,
    };
  }
}

/* ==================================================================
 * マップ初期化
 * ================================================================== */

function initMap() {
  var container = document.getElementById('map-container');

  map = new CityMap(container, {
    layers: [
      { id: 'zones',     url: API_BASE + '/api/v1/zones',     key: 'zones',     color: '#89b4fa', type: 'polygon', fill: true,  lineWidth: 1 },
      { id: 'parcels',   url: API_BASE + '/api/v1/parcels',   key: 'parcels',   color: '#585b70', type: 'polygon', fill: false, lineWidth: 1 },
      { id: 'paths',     url: API_BASE + '/api/v1/paths',     key: 'paths',     color: '#fab387', type: 'path',   lineWidth: 2 },
      { id: 'buildings', url: API_BASE + '/api/v1/buildings', key: 'buildings', color: '#cba6f7', type: 'polygon', fill: true,  lineWidth: 1 },
      { id: 'nodes',     url: API_BASE + '/api/v1/nodes/all', key: 'nodes',     color: '#f9e2af', type: 'node' },
    ],
  });

  /* レイヤートグル UI 構築 */
  var layerBox = document.getElementById('layer-controls');
  map.layers.forEach(function(l) {
    var row = document.createElement('div');
    row.className = 'layer-toggle';

    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = l.visible;
    cb.addEventListener('change', function() { map.setLayerVisible(l.id, cb.checked); });

    var cp = document.createElement('input');
    cp.type = 'color';
    cp.value = l.color;
    cp.addEventListener('change', function() { map.setLayerColor(l.id, cp.value); });

    var lbl = document.createElement('label');
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(' ' + l.id));

    row.appendChild(lbl);
    row.appendChild(cp);
    layerBox.appendChild(row);
  });

  /* フック登録 */
  map.hooks.onMouseDown = function(wx, wz, e) {
    return handleMouseDown(wx, wz, e);
  };
  map.hooks.onMouseMove = function(wx, wz, e) {
    handleMouseMove(wx, wz, e);
  };
  map.hooks.onMouseUp = function(wx, wz, e) {
    handleMouseUp(wx, wz, e);
  };
  map.hooks.onLeftClick = function(wx, wz, e) {
    handleLeftClick(wx, wz, e);
  };
  map.hooks.onRightClick = function(wx, wz, e) {
    handleRightClick(wx, wz, e);
  };
  map.hooks.onHover = function(wx, wz, e) {
    build.mouseWorld = { x: wx, z: wz };
    document.getElementById('coord-overlay').textContent = wx.toFixed(1) + ', ' + wz.toFixed(1);
    document.getElementById('zoom-overlay').textContent = Math.round(map.state.zoom * 100) + '%';

    /* プレビュー線を再描画（PLACINGモード時） */
    if (build.mode === 'PLACING' && build.points.length > 0) {
      map.draw();
    }
  };
  map.hooks.onDraw = function(ctx, state, m) {
    drawBuildingPath(ctx, state, m);
  };

  /* データ読み込み */
  map.loadAll().then(function() { map.resetView(); });
}

function resetAll() {
  resetPath();
  map.loadAll().then(function() { map.resetView(); });
}

/* ==================================================================
 * パス建設: マウスイベントハンドラ
 * ================================================================== */

/**
 * マウス押下時のフック。
 * EDITING モードでポイント付近をクリックした場合、ドラッグを開始して
 * true を返す（マップのパンを抑制）。それ以外は false を返す。
 */
function handleMouseDown(wx, wz, e) {
  if (e.button !== 0) return false;
  if (build.mode !== 'EDITING') return false;

  /* 制御点のヒット判定（ベジエモード時） */
  if (build.curveMode === 'bezier') {
    if (build.startControl && distScreen(wx, wz, build.startControl.x, build.startControl.z) < HIT_RADIUS) {
      build.dragging = { type: 'control', which: 'start' };
      map.canvas.style.cursor = 'grabbing';
      return true;
    }
    if (build.endControl && distScreen(wx, wz, build.endControl.x, build.endControl.z) < HIT_RADIUS) {
      build.dragging = { type: 'control', which: 'end' };
      map.canvas.style.cursor = 'grabbing';
      return true;
    }
  }

  /* ポイントのヒット判定 */
  var hit = findNearPoint(wx, wz);
  if (hit !== null) {
    build.dragging = { type: 'point', index: hit };
    map.canvas.style.cursor = 'grabbing';
    return true;
  }

  return false;
}

/** マウス移動時のフック。ドラッグ中のポイント/制御点を移動する */
function handleMouseMove(wx, wz, e) {
  if (!build.dragging) return;

  if (build.dragging.type === 'point') {
    build.points[build.dragging.index].x = wx;
    build.points[build.dragging.index].z = wz;
    if (build.curveMode === 'spline') computeSplineControlPoints();
  } else if (build.dragging.type === 'control') {
    if (build.dragging.which === 'start') {
      build.startControl.x = wx;
      build.startControl.z = wz;
    } else {
      build.endControl.x = wx;
      build.endControl.z = wz;
    }
  }

  map.draw();
}

/** マウス解放時のフック */
function handleMouseUp(wx, wz, e) {
  if (build.dragging) {
    build.dragging = null;
    map.canvas.style.cursor = 'grab';
    map.draw();
  }
}

/**
 * 左クリック時のハンドラ。
 * IDLE → 始点配置
 * PLACING → ウェイポイント追加
 * EDITING → 辺上クリックでウェイポイント挿入
 */
function handleLeftClick(wx, wz, e) {
  if (!build.selectedVariant) {
    updateStatusBar('バリアントを選択してください');
    return;
  }

  if (build.mode === 'IDLE') {
    build.points = [{ x: wx, z: wz, role: 'start' }];
    build.mode = 'PLACING';
    updateStatusBar();
    updateConfirmButton();
    map.draw();
  } else if (build.mode === 'PLACING') {
    build.points.push({ x: wx, z: wz, role: 'waypoint' });
    map.draw();
  } else if (build.mode === 'EDITING') {
    /* 辺上クリックでウェイポイント挿入 */
    var edgeIdx = findNearEdge(wx, wz);
    if (edgeIdx >= 0) {
      insertWaypoint(edgeIdx, { x: wx, z: wz });
      if (build.curveMode !== 'straight') initControlPoints();
      map.draw();
    }
  }
}

/**
 * 右クリック時のハンドラ。
 * PLACING → 終点確定
 * EDITING → ポイント削除
 */
function handleRightClick(wx, wz, e) {
  if (build.mode === 'PLACING') {
    finalizePath(wx, wz);
  } else if (build.mode === 'EDITING') {
    /* ポイントまたは制御点のヒット判定 */
    if (build.curveMode === 'bezier') {
      if (build.startControl && distScreen(wx, wz, build.startControl.x, build.startControl.z) < HIT_RADIUS) return;
      if (build.endControl && distScreen(wx, wz, build.endControl.x, build.endControl.z) < HIT_RADIUS) return;
    }
    var hit = findNearPoint(wx, wz);
    if (hit !== null) {
      deletePoint(hit);
      if (build.curveMode !== 'straight') initControlPoints();
      map.draw();
    }
  }
}

/* ==================================================================
 * パス建設: 状態遷移ロジック
 * ================================================================== */

/**
 * 配置モードを終了し、形状を確定する。
 * ウェイポイントがあれば最後のウェイポイントを終点に昇格する。
 * ウェイポイントがない場合は右クリック位置を終点とする。
 */
function finalizePath(wx, wz) {
  var pts = build.points;

  if (pts.length === 0) return;

  if (pts.length === 1) {
    /* 始点のみの場合は右クリック位置を終点とする */
    pts.push({ x: wx, z: wz, role: 'end' });
  } else {
    /* 最後のウェイポイントを終点に昇格 */
    pts[pts.length - 1].role = 'end';
  }

  build.mode = 'EDITING';

  /* 制御点を初期化 */
  if (build.curveMode !== 'straight') {
    initControlPoints();
  }

  updateStatusBar();
  updateConfirmButton();
  map.canvas.style.cursor = 'crosshair';
  map.draw();
}

/** 指定インデックスのウェイポイントを挿入する（edgeIdx の直後） */
function insertWaypoint(edgeIdx, pos) {
  build.points.splice(edgeIdx + 1, 0, { x: pos.x, z: pos.z, role: 'waypoint' });
  updateStatusBar();
  updateConfirmButton();
}

/** 指定インデックスのポイントを削除する */
function deletePoint(index) {
  var pts = build.points;
  if (pts.length <= 2) return;

  var point = pts[index];
  if (point.role === 'start') {
    /* 始点を削除 → 最初のウェイポイントを始点に昇格 */
    pts.splice(0, 1);
    pts[0].role = 'start';
  } else if (point.role === 'end') {
    /* 終点を削除 → 最後のウェイポイントを終点に昇格 */
    pts.splice(pts.length - 1, 1);
    pts[pts.length - 1].role = 'end';
  } else {
    pts.splice(index, 1);
  }

  updateStatusBar();
  updateConfirmButton();
}

/** 全リセット */
function resetPath() {
  build.mode = 'IDLE';
  build.points = [];
  build.startControl = null;
  build.endControl = null;
  build.dragging = null;

  updateStatusBar();
  updateConfirmButton();
  map.canvas.style.cursor = 'crosshair';
  map.draw();
}

/** キャンセル（現在は何もしない） */
function cancelPath() {
  /* 未実装 */
}

/* ==================================================================
 * パス建設: 描画
 * ================================================================== */

/**
 * 建設中パスのカスタム描画。CityMap の onDraw フックから呼ばれる。
 * 各ポイント・制御点・曲線・プレビュー線を描画する。
 */
function drawBuildingPath(ctx, state, m) {
  var pts = build.points;
  if (pts.length === 0) return;

  var color = build.selectedVariant
    ? (PATH_TYPE_COLORS[masterData[build.selectedVariant] ? masterData[build.selectedVariant].type : 0] || '#cdd6f4')
    : '#cdd6f4';

  /* ---- パス本体の描画 ---- */
  if (build.mode === 'PLACING') {
    /* 配置中: 点線で既存ポイントを結ぶ */
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var sp = m.worldToScreen(pts[i].x, pts[i].z);
      if (i === 0) ctx.moveTo(sp[0], sp[1]);
      else ctx.lineTo(sp[0], sp[1]);
    }
    /* マウス位置へのプレビュー線 */
    if (build.mouseWorld) {
      var mp = m.worldToScreen(build.mouseWorld.x, build.mouseWorld.z);
      ctx.lineTo(mp[0], mp[1]);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  } else if (build.mode === 'EDITING') {
    /* 確定済み: モードに応じて描画 */
    if (build.curveMode === 'straight') {
      drawStraightPath(ctx, m, color);
    } else {
      drawCurvePath(ctx, m, color);
    }
  }

  /* ---- ポイントの描画 ---- */
  for (var j = 0; j < pts.length; j++) {
    var ptColor = pts[j].role === 'start' ? '#a6e3a1'
                : pts[j].role === 'end'   ? '#f38ba8'
                : '#89b4fa';
    var pp = m.worldToScreen(pts[j].x, pts[j].z);

    ctx.fillStyle = ptColor;
    ctx.strokeStyle = '#1e1e2e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(pp[0], pp[1], 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    /* 役割ラベル */
    ctx.fillStyle = '#1e1e2e';
    ctx.font = '8px Consolas, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var roleLabel = pts[j].role === 'start' ? 'S' : pts[j].role === 'end' ? 'E' : (j).toString();
    ctx.fillText(roleLabel, pp[0], pp[1]);
  }

  /* ---- 制御点の描画（ベジエモード時） ---- */
  if (build.mode === 'EDITING' && build.curveMode === 'bezier') {
    drawControlHandle(ctx, m, build.startControl, pts[0], '#f9e2af');
    if (pts.length <= 2) {
      drawControlHandle(ctx, m, build.endControl, pts[pts.length - 1], '#f9e2af');
    } else {
      drawControlHandle(ctx, m, build.endControl, pts[pts.length - 1], '#f9e2af');
    }
  }
}

/** 直線パスの描画 */
function drawStraightPath(ctx, m, color) {
  var pts = build.points;
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (var i = 0; i < pts.length; i++) {
    var sp = m.worldToScreen(pts[i].x, pts[i].z);
    if (i === 0) ctx.moveTo(sp[0], sp[1]);
    else ctx.lineTo(sp[0], sp[1]);
  }
  ctx.stroke();
}

/** 曲線パスの描画 */
function drawCurvePath(ctx, m, color) {
  var pts = build.points;
  if (pts.length < 2) return;

  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();

  var s0 = m.worldToScreen(pts[0].x, pts[0].z);
  ctx.moveTo(s0[0], s0[1]);

  if (pts.length === 2) {
    /* 2点: start_control → end_control のベジエ */
    var sc = build.startControl ? m.worldToScreen(build.startControl.x, build.startControl.z) : s0;
    var ec = build.endControl ? m.worldToScreen(build.endControl.x, build.endControl.z) : m.worldToScreen(pts[1].x, pts[1].z);
    var ep = m.worldToScreen(pts[1].x, pts[1].z);
    ctx.bezierCurveTo(sc[0], sc[1], ec[0], ec[1], ep[0], ep[1]);
  } else {
    /* 3点以上: セグメントごとにベジエ曲線を描画 */
    for (var i = 0; i < pts.length - 1; i++) {
      var cp1 = computeSegmentCP1(pts, i);
      var cp2 = computeSegmentCP2(pts, i);
      var ePt = m.worldToScreen(pts[i + 1].x, pts[i + 1].z);
      var scp1 = m.worldToScreen(cp1.x, cp1.z);
      var scp2 = m.worldToScreen(cp2.x, cp2.z);
      ctx.bezierCurveTo(scp1[0], scp1[1], scp2[0], scp2[1], ePt[0], ePt[1]);
    }
  }

  ctx.stroke();
}

/**
 * セグメント i の第1制御点を計算する。
 * 最初のセグメントでは startControl を使用し、
 * それ以外は Catmull-Rom 的に自動計算する。
 */
function computeSegmentCP1(pts, i) {
  if (i === 0 && build.startControl) return build.startControl;
  var prev = pts[Math.max(0, i - 1)];
  var curr = pts[i];
  var next = pts[i + 1];
  return {
    x: curr.x + (next.x - prev.x) / 6,
    z: curr.z + (next.z - prev.z) / 6,
  };
}

/**
 * セグメント i の第2制御点を計算する。
 * 最後のセグメントでは endControl を使用し、
 * それ以外は Catmull-Rom 的に自動計算する。
 */
function computeSegmentCP2(pts, i) {
  if (i === pts.length - 2 && build.endControl) return build.endControl;
  var curr = pts[i];
  var next = pts[i + 1];
  var after = pts[Math.min(pts.length - 1, i + 2)];
  return {
    x: next.x - (after.x - curr.x) / 6,
    z: next.z - (after.z - curr.z) / 6,
  };
}

/** 制御点ハンドルの描画（点 + 点からの接続線） */
function drawControlHandle(ctx, m, cp, anchor, color) {
  if (!cp) return;
  var scp = m.worldToScreen(cp.x, cp.z);
  var sap = m.worldToScreen(anchor.x, anchor.z);

  /* 接続線 */
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(sap[0], sap[1]);
  ctx.lineTo(scp[0], scp[1]);
  ctx.stroke();
  ctx.setLineDash([]);

  /* 制御点 */
  ctx.fillStyle = color;
  ctx.strokeStyle = '#1e1e2e';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.rect(scp[0] - 4, scp[1] - 4, 8, 8);
  ctx.fill();
  ctx.stroke();
}

/* ==================================================================
 * ヒット判定ユーティリティ
 * ================================================================== */

/**
 * スクリーン空間でのワールド座標間距離を計算する。
 * ズーム倍率を考慮してピクセル距離に変換する。
 */
function distScreen(wx1, wz1, wx2, wz2) {
  var s1 = map.worldToScreen(wx1, wz1);
  var s2 = map.worldToScreen(wx2, wz2);
  var dx = s1[0] - s2[0];
  var dz = s1[1] - s2[1];
  return Math.sqrt(dx * dx + dz * dz);
}

/**
 * 指定ワールド座標に最も近いポイントのインデックスを返す。
 * HIT_RADIUS 以内になければ null を返す。
 */
function findNearPoint(wx, wz) {
  var bestDist = Infinity;
  var bestIdx = null;
  for (var i = 0; i < build.points.length; i++) {
    var d = distScreen(wx, wz, build.points[i].x, build.points[i].z);
    if (d < bestDist) {
      bestDist = d;
      bestIdx = i;
    }
  }
  return bestDist <= HIT_RADIUS ? bestIdx : null;
}

/**
 * 指定ワールド座標に最も近い辺のインデックスを返す。
 * 辺は points[i] → points[i+1] を表す。EDGE_HIT_RADIUS 以内になければ -1 を返す。
 */
function findNearEdge(wx, wz) {
  if (build.points.length < 2) return -1;

  var bestDist = Infinity;
  var bestIdx = -1;
  var sClick = map.worldToScreen(wx, wz);

  for (var i = 0; i < build.points.length - 1; i++) {
    var sA = map.worldToScreen(build.points[i].x, build.points[i].z);
    var sB = map.worldToScreen(build.points[i + 1].x, build.points[i + 1].z);
    var d = pointToSegmentDist(sClick[0], sClick[1], sA[0], sA[1], sB[0], sB[1]);
    if (d < bestDist) {
      bestDist = d;
      bestIdx = i;
    }
  }

  return bestDist <= EDGE_HIT_RADIUS ? bestIdx : -1;
}

/** 点 (px, py) と線分 (ax,ay)-(bx,by) の最短距離 */
function pointToSegmentDist(px, py, ax, ay, bx, by) {
  var dx = bx - ax;
  var dy = by - ay;
  var lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return Math.sqrt((px - ax) * (px - ax) + (py - ay) * (py - ay));
  var t = ((px - ax) * dx + (py - ay) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  var projX = ax + t * dx;
  var projY = ay + t * dy;
  return Math.sqrt((px - projX) * (px - projX) + (py - projY) * (py - projY));
}

/* ==================================================================
 * UI 更新ヘルパー
 * ================================================================== */

function updateConfirmButton() {
  var btn = document.getElementById('btn-confirm');
  btn.disabled = !(build.mode === 'EDITING' && build.points.length >= 2 && build.selectedVariant);
}

function updateStatusBar(message) {
  var bar = document.getElementById('status-bar');
  if (message) {
    bar.textContent = message;
    return;
  }

  if (build.mode === 'IDLE') {
    bar.textContent = 'バリアントを選択してクリックで配置開始';
  } else if (build.mode === 'PLACING') {
    var n = build.points.length;
    if (n === 1) {
      bar.textContent = '始点配置済み。クリックでウェイポイント追加 / 右クリックで終点確定';
    } else {
      bar.textContent = 'ポイント数: ' + n + '。クリックで追加 / 右クリックで終点確定';
    }
  } else if (build.mode === 'EDITING') {
    bar.textContent = '形状確定済み (' + build.points.length + '点)。ドラッグで移動 / 右クリックで削除 / 確定ボタンで送信';
  }
}

/* ==================================================================
 * バックエンド送信
 * ================================================================== */

function confirmPath() {
  if (build.mode !== 'EDITING' || build.points.length < 2 || !build.selectedVariant) return;

  var pts = build.points;
  var h = build.height;
  var isCurved = build.curveMode !== 'straight';

  var pathData = {
    path_temp_id: 'build_' + Date.now(),
    path_variant: build.selectedVariant,
    start_point: [pts[0].x, h, pts[0].z],
    end_point: [pts[pts.length - 1].x, h, pts[pts.length - 1].z],
    curved: isCurved,
  };

  /* ウェイポイント（中間点） */
  var waypoints = [];
  for (var i = 1; i < pts.length - 1; i++) {
    waypoints.push([pts[i].x, h, pts[i].z]);
  }
  if (waypoints.length > 0) {
    pathData.waypoints = waypoints;
  }

  /* 制御点 */
  if (isCurved && build.startControl) {
    pathData.start_control = [build.startControl.x, h, build.startControl.z];
  }
  if (isCurved && build.endControl) {
    pathData.end_control = [build.endControl.x, h, build.endControl.z];
  }

  var payload = { paths: [pathData] };

  fetch(API_BASE + '/api/v1/paths/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  })
  .then(function(r) {
    if (!r.ok) return r.json().then(function(d) { throw new Error(JSON.stringify(d)); });
    return r.json();
  })
  .then(function(result) {
    updateStatusBar('パス作成成功: ' + JSON.stringify(result.paths));
    resetPath();
    /* 既存パスレイヤーを再読み込み */
    map.loadLayer('paths').then(function() { map.draw(); });
  })
  .catch(function(err) {
    updateStatusBar('エラー: ' + err.message);
    console.error('Path creation failed:', err);
  });
}

/* ==================================================================
 * 起動
 * ================================================================== */

loadMasterData();
initMap();
</script>
