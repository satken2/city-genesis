# 車種ごとの描画モデル・バリアント定義(任意)。
# VehicleModelConfig が読み込む。定義した車種は Models/Vehicles/{type}/{variant} を
# ModelManager 経由で解決し、seed で1つを選んで描画する(同一車種内でランダムに複数 fbx)。
# 未定義の車種は Models/Vehicles/{type} → 汎用車 → 単純な箱、の順にフォールバックする。
#
# 車種ID(Constants.VEHICLE_*): 10=乗用車, 11=トラック, 12=バス, 13=商用車
#
# 例(fbx を Assets/Resources/Models/Vehicles/10/0.prefab, /1.prefab として配置した場合):
vehicles:
  10: # VEHICLE_STANDARD
    variants: [0, 1]
  11: # VEHICLE_TRUCK
    variants: [0, 1]
  12: # VEHICLE_BUS
    variants: [0, 1]
  13: # VEHICLE_COMMERCIAL
    variants: [0, 1]
  14: # VEHICLE_TRAM
    variants: [0]
  20: # VEHICLE_METRO_TRAIN
    variants: [0, 1]
  21: # VEHICLE_PASSANGER_TRAIN
    variants: [0, 1]
  22: # VEHICLE_FREIGHT_TRAIN
    variants: [0, 1]
  23: # VEHICLE_HIGH_SPEED_TRAIN
    variants: [0, 1]
