    - サウンドシステム: programs/サウンドシステム.md
    - 達成目標ウィンドウ: programs/達成目標ウィンドウ.md
  - API Reference: api/index.html

plugins:
  - search:
      lang:
        - ja
        - en
  - i18n:
      docs_structure: suffix
      languages:
        - locale: ja
          name: 日本語
          default: true
          build: true
        - locale: en
          name: English
          build: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/satken2/genesis-docs
      name: GitHub

