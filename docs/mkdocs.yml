site_name: City Genesis Docs
# TODO: site_url を Cloudflare Pages の実際のURLに更新してください
# 例: https://city-genesis-docs.pages.dev/
site_url: https://city-genesis-docs.pages.dev/
site_description: City Genesis - 都市建造経済シミュレーションゲームの設計ドキュメント
repo_url: https://github.com/satken2/genesis-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: ja
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
  font:
    text: Noto Sans JP
    code: JetBrains Mono

nav:
  - ホーム: index.md
  - 経済シミュレーション:
    - 全体概要: economics/1_全体概要.md
    - 経済主体: economics/2_経済主体.md
    - 道路網: economics/3_道路網.md
    - 地区と土地区画: economics/4_地区と土地区画.md
    - 公共交通機関: economics/6_公共交通機関.md
    - 金融システム: economics/7_金融システム.md
    - 商品市場: economics/8_商品市場.md
    - 生産活動: economics/9_生産活動.md
    - 消費活動: economics/10_消費活動.md
    - 建物: economics/12_建物.md
    - 建設作業量と施工能力: economics/25_建設作業量と施工能力.md
    - 不動産市場: economics/13_不動産市場.md
    - 世帯: economics/15_世帯.md
    - 労働市場: economics/16_労働市場.md
    - 教育: economics/17_教育.md
    - 移民: economics/18_移民.md
    - 住環境: economics/19_住環境.md
    - 事故と災害: economics/20_事故と災害.md
    - 天然資源: economics/21_天然資源.md
    - 予算管理: economics/22_予算管理.md
    - 施政スコア: economics/23_施政スコア.md
    - 達成クエスト: economics/24_達成クエスト.md
    - インフラ網: economics/26_インフラ網.md
