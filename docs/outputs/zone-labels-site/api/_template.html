<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>API Reference - City Genesis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      display: flex;
      flex-direction: column;
      background: #fff;
    }
    .top-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.6rem 1.2rem;
      background: #3f51b5;
      color: #fff;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .top-bar a {
      color: #fff;
      text-decoration: none;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .top-bar a:hover { opacity: 1; }
    .top-bar .site-name {
      font-weight: 700;
      font-size: 1rem;
      opacity: 1;
    }
    .top-bar .sep { opacity: 0.4; }
    .redoc-container {
      flex: 1;
      min-height: 0;
    }
    redoc {
      display: block;
    }
  </style>
  <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
</head>
<body>
  <div class="top-bar">
    <a href="../" class="site-name">City Genesis Docs</a>
    <span class="sep">/</span>
    <span>API Reference</span>
  </div>
  <div class="redoc-container">
    <redoc scroll-y-offset=".top-bar"></redoc>
  </div>
  <script>
    const spec = /* __OPENAPI_SPEC_PLACEHOLDER__ */;
    Redoc.init(spec, {}, document.querySelector('redoc'));
  </script>
</body>
</html>
